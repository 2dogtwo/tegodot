name: 🐧 Linux Mono Builds
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
 
# Global Settings
env:
  SCONS_FLAGS: >-
    disable_xr=yes 
    engine_update_check=no 
    module_camera_enabled=no 
    module_mobile_vr_enabled=no 
    module_openxr_enabled=no 
    module_webxr_enabled=no 
    module_mono_enabled=yes 
    vulkan=no  
  GODOT_CPP_BRANCH: 4.5
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt
  LSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/lsan.txt
  TSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/tsan.txt
  UBSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/ubsan.txt

jobs:
  build-linux:
    # Stay one LTS before latest to increase portability of Linux artifacts.
    runs-on: ubuntu-22.04-arm
    name: ${{ matrix.name }}
    timeout-minutes: 420
    strategy:
      fail-fast: false
  #    max-parallel: 1
      matrix:
        include:
          # - name: Editor w/ Mono thinlld
          #   cache-name: linux-editor-mono-thinlld
          #   target: editor
          #   scons-flags: >-             
          #     linker=lld
          #     lto=thin
          #   bin: ./bin/godot.linuxbsd.editor.arm64.mono
          #   build-mono: true
           
            
          - name: Editor w/ Mono -jllvm
            cache-name: linux-editor-mono-jllvm
            target: editor
            scons-flags: use_llvm=yes
            bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
            build-mono: true
            
            
          - name: Editor with clang all 
            cache-name: linux-editor-mono-all
            target: editor
            scons-flags: >-             
              use_llvm=yes
              linker=lld
              lto=thin
            bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary editor build.
            build-mono: true
            
          - name: Editor with clang lldllvm 
            cache-name: linux-editor-mono-lldllvm
            target: editor
            scons-flags: >-             
              use_llvm=yes
              linker=lld
            bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary editor build.
            build-mono: true
            
          - name: Editor with clang thinllvm
            cache-name: linux-editor-mono-thinllvm
            target: editor
            scons-flags: >-             
              lto=thin
              use_llvm=yes
            bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary editor build.
            build-mono: true
       
          - name: Editor with clang mold 
            cache-name: linux-editor-mono-mold
            target: editor
            scons-flags: >-             
              use_llvm=yes
              linker=mold
              lto=none
            bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary editor build.
            build-mono: true
            proj-test: true
           
          - name: Editor with clang thinmold 
            cache-name: linux-editor-mono-thinmold
            target: editor
            scons-flags: >-             
              use_llvm=yes
              linker=mold
              lto=thin
            bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary editor build.
            build-mono: true
            proj-test: true

          
#out of memory
          # - name: Editor with clang fullmold 
          #   cache-name: linux-editor-mono-fullmold
          #   target: editor
          #   scons-flags: >-             
          #     use_llvm=yes
          #     linker=mold
          #     lto=full
          #   bin: ./bin/godot.linuxbsd.editor.arm64.llvm.mono
          #   # Test our oldest supported SCons/Python versions on one arbitrary editor build.
          #   build-mono: true
          #   proj-test: true
                               
    
          # - name: Template w/ Mono, release thinlld
          #   cache-name: linux-template_release-mono-thinlld
          #   target: template_release
          #   scons-flags: >-             
          #     linker=lld
          #     lto=thin
          #   bin: ./bin/godot.linuxbsd.template_release.arm64.mono
           
           
            
          - name: Template w/ Mono, release -jllvm
            cache-name: linux-template_release-mono-jllvm
            target: template_release
            scons-flags: use_llvm=yes
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
          
            
            
          - name: Template w/ Mono, release all 
            cache-name: linux-template_release-mono-all
            target: template_release
            scons-flags: >-             
              use_llvm=yes
              linker=lld
              lto=thin
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary template_release build.
           
            
          - name: Template w/ Mono, release lldllvm 
            cache-name: linux-template_release-mono-lldllvm
            target: template_release
            scons-flags: >-             
              use_llvm=yes
              linker=lld
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary template_release build.
           
            
          - name: Template w/ Mono, release thinllvm
            cache-name: linux-template_release-mono-thinllvm
            target: template_release
            scons-flags: >-             
              lto=thin
              use_llvm=yes
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary template_release build.
           
       
          - name: Template w/ Mono, release mold 
            cache-name: linux-template_release-mono-mold
            target: template_release
            scons-flags: >-             
              use_llvm=yes
              linker=mold
              lto=none
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary template_release build.
            proj-test: true
           
          - name: Template w/ Mono, release thinmold 
            cache-name: linux-template_release-mono-thinmold
            target: template_release
            scons-flags: >-             
              use_llvm=yes
              linker=mold
              lto=thin
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary template_release build.
            proj-test: true

          - name: Template w/ Mono, release fullmold 
            cache-name: linux-template_release-mono-fullmold
            target: template_release
            scons-flags: >-             
              use_llvm=yes
              linker=mold
              lto=full
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono
            # Test our oldest supported SCons/Python versions on one arbitrary template_release build.
            proj-test: true
     
          - name: Template w/ Mono, release fullall
            cache-name: linux-template-mono-fullall
            target: template_release
            scons-flags: >-             
              lto=full
              use_llvm=yes
              linker=lld
            bin: ./bin/godot.linuxbsd.template_release.arm64.llvm.mono


    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup dependencies
        run: |
          free -h
          sudo apt-get update
          sudo apt-get install libwayland-bin  # TODO: Figure out somehow how to embed this one.
          sudo apt-get install mesa-vulkan-drivers

      - name: Free disk space on runner
        run: |
          echo "Disk usage before:" && df -h
          sudo rm -rf /usr/local/lib/android
          echo "Disk usage after:" && df -h

    

      - name: Setup Python and SCons (legacy versions)
        uses: ./.github/actions/godot-deps
        with:
          # Sync with Ensure*Version in SConstruct.
          python-arch: arm64
        continue-on-error: true

      - name: Force remove preinstalled .NET SDKs
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup older .NET SDK as baseline
        uses: actions/setup-dotnet@v4
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.416

      - name: Install mold linker
        if: matrix.proj-test
        uses: rui314/setup-mold@v1


      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Output file contents on failure
        if: failure()
        run: |          
          sconsign -r .sconsign
          cat  .sconsign
        
      - name: Generate C# glue
        if: matrix.build-mono
        run: |
          chmod +x bin/godot.*
          ${{ matrix.bin }} --headless --generate-mono-glue ./modules/mono/glue
          ls -la bin/
          ls -la ./

      - name: Build .NET solutions
        if: matrix.build-mono
        run: |
          dotnet --info
          chmod +x ./modules/mono/build_scripts/build_assemblies.py
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --push-nupkgs-local=./bin/nupkgs --werror
          ls -la bin/
          ls -la ./

      - name: Prepare artifact
        run: |
          strip bin/godot.*
          chmod +x bin/godot.*
          ls -l bin/

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}


      - name: Zip artifacts
        run: |
          mkdir -p zipbin/
          zip -r9  "zipbin/${{ matrix.cache-name }}.zip" bin/*
 
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linuxbsd-Mono-Builds
          files: |
            zipbin/*.zip

  
      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
        continue-on-error: true
        

        
